name: Build Windows

on:
  push:
    tags:
      - 'v*'   # v2.6.0 등 태그가 푸시될 때 자동 실행

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create Windows Installer (Inno Setup)
        run: dart run inno_bundle:build --release

      - name: List build directory (debug)
        run: |
          echo "=== build/windows/x64 ==="
          dir build\windows\x64 /s /b 2>&1 | findstr /i ".exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: macmahon-windows-installer-${{ github.ref_name }}
          path: build/windows/x64/installer/Release/*.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          files: |
            build/windows/x64/installer/Release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
